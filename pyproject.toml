[project]
name = "news-fanout"
version = "0.1.0"
description = "News ingestion, topic classification, fan-out-on-read feed and digest push notifications."
requires-python = ">=3.12, <3.13"
dependencies = [
    "asyncpg==0.29.0",
    "fastapi==0.136.3",
    "prometheus-fastapi-instrumentator==7.0.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "redis==5.0.8",
    "sqlalchemy[asyncio]~=2.0.48",
    "uvicorn==0.49.0",
    "logging-helpers",
]

[tool.uv.sources]
logging-helpers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_fanout"]
