# Local development stack (OrbStack / Docker Desktop).
#   docker compose up --build
#   python3 scripts/e2e_test.py
#
# The deployed stack is the same shape — see docker-compose.prod.yml.

name: news-fanout

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: news_fanout
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d news_fanout"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
    image: news-fanout:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NEWS_FANOUT_ROLE: all
      NEWS_FANOUT_DATABASE__HOST: postgres
      NEWS_FANOUT_DATABASE__PASSWORD: postgres
      NEWS_FANOUT_REDIS__HOST: redis
      # Short digest window so the push pipeline is observable during a test run.
      NEWS_FANOUT_PUSH__DIGEST_INTERVAL_SECONDS: "15"
      LOG_FORMAT: text
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  postgres-data:
